<!DOCTYPE html>
<html>
<head>
    <title>Supabase Login System</title>
</head>
<body style="font-family: Arial; text-align: center; margin-top: 50px;">

    <h2>Login (Mobile + PIN)</h2>

    <input type="text" id="mobile" placeholder="Enter Mobile Number"><br><br>
    <input type="password" id="pin" placeholder="Enter PIN"><br><br>

    <button onclick="login()">Login</button>
    <button onclick="addUser()">Add Test User</button>
    <button onclick="getUsers()">Show Users</button>

    <p id="result"></p>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // 🔴 Replace this with your Supabase Project URL
        const supabaseUrl = "https://YOUR_PROJECT_ID.supabase.co";

        // ✅ Your Key (Already Added)
        const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ra2hheGptYmp5YWVyeWNkb2JyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NjAyMjcsImV4cCI6MjA4OTMzNjIyN30.JayQMtvX5DARwKwowFtqczmGhaeiC58KOHXrAdPzaTg";

        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // ✅ Add User
        async function addUser() {
            const { data, error } = await supabase
                .from('users')
                .insert([
                    { name: "Test User", mobile: "9999999999", pin: "1234" }
                ]);

            if (error) {
                document.getElementById("result").innerText = "Error: " + error.message;
            } else {
                document.getElementById("result").innerText = "User Added Successfully!";
            }
        }

        // ✅ Get Users
        async function getUsers() {
            const { data, error } = await supabase
                .from('users')
                .select('*');

            if (error) {
                document.getElementById("result").innerText = "Error: " + error.message;
            } else {
                document.getElementById("result").innerText = JSON.stringify(data, null, 2);
                console.log(data);
            }
        }

        // ✅ Login Function
        async function login() {
            const mobile = document.getElementById("mobile").value;
            const pin = document.getElementById("pin").value;

            const { data, error } = await supabase
                .from('users')
                .select('*')
                .eq('mobile', mobile)
                .eq('pin', pin);

            if (error) {
                document.getElementById("result").innerText = "Error: " + error.message;
            } else if (data.length > 0) {
                document.getElementById("result").innerText = "Login Successful ✅";
            } else {
                document.getElementById("result").innerText = "Invalid Mobile or PIN ❌";
            }
        }
    </script>

</body>
</html>

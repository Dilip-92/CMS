<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>LexForge | Advocate Case Management Suite</title>
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f5f7fc 0%, #eef2f9 100%);
      min-height: 100vh;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(2px);
      border-radius: 32px;
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0,0,0,0.02);
      border: 1px solid rgba(255,255,255,0.6);
    }

    .btn-primary {
      background: #1e3a8a;
      transition: all 0.2s ease;
      color: white;
      font-weight: 600;
      border: none;
      padding: 10px 20px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .btn-primary:hover {
      background: #0f2b6d;
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(30,58,138,0.2);
    }
    .btn-secondary {
      background: #f0f2f5;
      color: #1f2937;
      border: 1px solid #e2e8f0;
      font-weight: 500;
    }
    .btn-secondary:hover {
      background: #e6e9ef;
    }
    input, select, textarea {
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 10px 16px;
      width: 100%;
      font-size: 0.9rem;
      transition: 0.2s;
      background: white;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    .status-badge {
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      display: inline-block;
    }
    .status-active { background: #dcfce7; color: #15803d; }
    .status-pending { background: #fff3e3; color: #b45309; }
    .status-closed { background: #f1f5f9; color: #334155; }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      text-align: left;
      padding: 14px 8px;
      border-bottom: 1px solid #edf2f7;
    }
    th {
      font-weight: 600;
      color: #1e293b;
    }
    .modal-overlay {
      position: fixed;
      top:0; left:0;
      width:100%; height:100%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-container {
      background: white;
      max-width: 550px;
      width: 90%;
      border-radius: 32px;
      padding: 28px;
    }
    @media (max-width: 768px) {
      .flex-responsive { flex-direction: column; gap: 1rem; }
      th, td { font-size: 0.8rem; padding: 10px 4px; }
    }
    .toast-notification {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1e3a8a;
      color: white;
      padding: 12px 24px;
      border-radius: 40px;
      z-index: 1100;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
  </style>
</head>
<body>

<div id="app"></div>

<script>
  // ==================== CONFIGURATION ====================
  // 🔴 IMPORTANT: Replace with your actual Supabase URL and ANON KEY
  const SUPABASE_URL = "https://nkkhaxjmbjyaerycdobr.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ra2hheGptYmp5YWVyeWNkb2JyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NjAyMjcsImV4cCI6MjA4OTMzNjIyN30.JayQMtvX5DARwKwowFtqczmGhaeiC58KOHXrAdPzaTg";  // <-- REPLACE THIS with your actual anon key
  
  // ==================== GLOBAL STATE ====================
  let supabaseClient = null;
  let currentUser = null;
  let activeTab = "cases";
  let casesList = [];
  let hearingsList = [];
  let editingCase = null;
  let editingHearing = null;
  
  // Helper: Show toast message
  function showToast(message, isError = false) {
    const toast = document.createElement('div');
    toast.className = 'toast-notification';
    toast.style.backgroundColor = isError ? '#dc2626' : '#1e3a8a';
    toast.innerHTML = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }
  
  // Initialize Supabase
  function initSupabase() {
    if (!SUPABASE_URL || SUPABASE_URL === "YOUR_SUPABASE_URL") {
      showToast("⚠️ Please update SUPABASE_URL in the script", true);
      return { error: true };
    }
    if (!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY === "YOUR_SUPABASE_ANON_KEY") {
      showToast("⚠️ Please set your Supabase anon key", true);
      return { error: true };
    }
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    return { error: false };
  }
  
  // Check session
  async function checkSession() {
    if (!supabaseClient) return null;
    const { data: { session }, error } = await supabaseClient.auth.getSession();
    if (error || !session) return null;
    currentUser = session.user;
    await fetchUserProfile();
    return currentUser;
  }
  
  async function fetchUserProfile() {
    if (!currentUser) return;
    const { data, error } = await supabaseClient
      .from('profiles')
      .select('full_name')
      .eq('id', currentUser.id)
      .single();
    if (!error && data) {
      currentUser.user_metadata = { ...currentUser.user_metadata, full_name: data.full_name };
    }
  }
  
  // ==================== CASES CRUD ====================
  async function loadCases() {
    if (!currentUser) return;
    const { data, error } = await supabaseClient
      .from('cases')
      .select('*')
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending: false });
    if (!error) casesList = data || [];
    else console.error(error);
    renderDashboard();
  }
  
  async function loadHearings() {
    if (!currentUser) return;
    const { data, error } = await supabaseClient
      .from('hearings')
      .select('*, cases(case_title, case_number)')
      .eq('user_id', currentUser.id)
      .order('hearing_date', { ascending: false });
    if (!error) hearingsList = data || [];
    else console.error(error);
    if (activeTab === 'hearings') renderDashboard();
  }
  
  async function saveCase(caseData) {
    if (!currentUser) return false;
    const payload = { ...caseData, user_id: currentUser.id };
    let result;
    if (editingCase) {
      result = await supabaseClient
        .from('cases')
        .update(payload)
        .eq('id', editingCase.id)
        .eq('user_id', currentUser.id);
    } else {
      result = await supabaseClient.from('cases').insert([payload]);
    }
    if (!result.error) {
      await loadCases();
      closeAllModals();
      showToast(editingCase ? "Case updated successfully" : "Case created successfully");
      return true;
    } else {
      showToast("Error: " + result.error.message, true);
      return false;
    }
  }
  
  async function deleteCase(caseId) {
    if (!confirm("Delete this case permanently? All related hearings will be removed.")) return;
    const { error } = await supabaseClient
      .from('cases')
      .delete()
      .eq('id', caseId)
      .eq('user_id', currentUser.id);
    if (!error) {
      await loadCases();
      await loadHearings();
      showToast("Case deleted successfully");
    } else showToast(error.message, true);
  }
  
  async function saveHearing(hearingData) {
    if (!currentUser) return;
    const payload = {
      case_id: hearingData.case_id,
      hearing_date: hearingData.hearing_date,
      hearing_notes: hearingData.hearing_notes,
      user_id: currentUser.id,
    };
    let result;
    if (editingHearing) {
      result = await supabaseClient
        .from('hearings')
        .update(payload)
        .eq('id', editingHearing.id)
        .eq('user_id', currentUser.id);
    } else {
      result = await supabaseClient.from('hearings').insert([payload]);
    }
    if (!result.error) {
      await loadHearings();
      closeAllModals();
      showToast(editingHearing ? "Hearing updated" : "Hearing scheduled");
    } else showToast("Error: " + result.error.message, true);
  }
  
  async function deleteHearing(hearingId) {
    if (!confirm("Remove this hearing record?")) return;
    const { error } = await supabaseClient
      .from('hearings')
      .delete()
      .eq('id', hearingId)
      .eq('user_id', currentUser.id);
    if (!error) {
      await loadHearings();
      showToast("Hearing deleted");
    } else showToast(error.message, true);
  }
  
  // ==================== AUTH ====================
  async function handleLogin(email, password, isSignUp = false, fullName = "") {
    if (!supabaseClient) {
      showToast("Supabase not initialized", true);
      return false;
    }
    try {
      if (isSignUp) {
        const { data, error } = await supabaseClient.auth.signUp({
          email, password,
          options: { data: { full_name: fullName } }
        });
        if (error) throw error;
        if (data.user) {
          const { error: profileError } = await supabaseClient
            .from('profiles')
            .insert([{ id: data.user.id, full_name: fullName }]);
          if (profileError && profileError.code !== '23505') console.warn(profileError);
          showToast("Sign up successful! Please login.");
        }
        return false;
      } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        currentUser = data.user;
        await fetchUserProfile();
        await loadCases();
        await loadHearings();
        renderDashboard();
        showToast(`Welcome back, ${currentUser.user_metadata?.full_name || currentUser.email}`);
        return true;
      }
    } catch (err) {
      showToast(err.message, true);
      return false;
    }
  }
  
  async function handleLogout() {
    await supabaseClient.auth.signOut();
    currentUser = null;
    casesList = [];
    hearingsList = [];
    renderLoginScreen();
    showToast("Logged out successfully");
  }
  
  // ==================== UI RENDERING ====================
  function renderLoginScreen() {
    const app = document.getElementById("app");
    app.innerHTML = `
      <div class="min-h-screen flex items-center justify-center p-5" style="min-height:100vh; background: radial-gradient(circle at 10% 20%, #eef2ff, #e0e7ff);">
        <div class="glass-card w-full max-w-md p-8 shadow-2xl">
          <div class="text-center mb-6">
            <i class="fas fa-gavel text-5xl text-indigo-800 mb-3"></i>
            <h2 class="text-3xl font-bold text-gray-800">LexForge</h2>
            <p class="text-gray-500 mt-1">Advocate Case Management Suite</p>
          </div>
          <div id="auth-tabs" class="flex gap-2 mb-6 border-b">
            <button id="tab-login-btn" class="py-2 px-4 font-semibold text-indigo-700 border-b-2 border-indigo-600">Login</button>
            <button id="tab-signup-btn" class="py-2 px-4 font-semibold text-gray-500">Sign Up</button>
          </div>
          <div id="login-panel">
            <input type="email" id="login-email" placeholder="Email address" class="mb-3" />
            <input type="password" id="login-password" placeholder="Password" class="mb-4" />
            <button id="do-login-btn" class="btn-primary w-full py-3">Access Dashboard <i class="fas fa-arrow-right ml-1"></i></button>
          </div>
          <div id="signup-panel" style="display:none;">
            <input type="text" id="signup-name" placeholder="Full Name" class="mb-3" />
            <input type="email" id="signup-email" placeholder="Email address" class="mb-3" />
            <input type="password" id="signup-password" placeholder="Password (min 6 chars)" class="mb-4" />
            <button id="do-signup-btn" class="btn-primary w-full py-3 bg-indigo-700">Create Account</button>
          </div>
          <p class="text-xs text-center text-gray-400 mt-6">🔐 Secure RLS | Your data is private</p>
        </div>
      </div>
    `;
    
    document.getElementById("tab-login-btn").onclick = () => {
      document.getElementById("login-panel").style.display = "block";
      document.getElementById("signup-panel").style.display = "none";
      document.getElementById("tab-login-btn").classList.add("border-b-2", "border-indigo-600", "text-indigo-700");
      document.getElementById("tab-signup-btn").classList.remove("border-b-2", "border-indigo-600", "text-indigo-700");
    };
    document.getElementById("tab-signup-btn").onclick = () => {
      document.getElementById("signup-panel").style.display = "block";
      document.getElementById("login-panel").style.display = "none";
      document.getElementById("tab-signup-btn").classList.add("border-b-2", "border-indigo-600", "text-indigo-700");
      document.getElementById("tab-login-btn").classList.remove("border-b-2", "border-indigo-600", "text-indigo-700");
    };
    document.getElementById("do-login-btn").onclick = async () => {
      const email = document.getElementById("login-email").value;
      const pwd = document.getElementById("login-password").value;
      if(email && pwd) await handleLogin(email, pwd, false);
      else showToast("Enter email and password", true);
    };
    document.getElementById("do-signup-btn").onclick = async () => {
      const name = document.getElementById("signup-name").value;
      const email = document.getElementById("signup-email").value;
      const pwd = document.getElementById("signup-password").value;
      if(!name || !email || pwd.length<6) { showToast("Full name, valid email, password min 6 chars", true); return; }
      await handleLogin(email, pwd, true, name);
      renderLoginScreen();
    };
  }
  
  function renderDashboard() {
    if (!currentUser) return;
    const app = document.getElementById("app");
    const userName = currentUser.user_metadata?.full_name || currentUser.email?.split('@')[0] || "Advocate";
    app.innerHTML = `
      <div class="max-w-7xl mx-auto p-4 md:p-6">
        <div class="glass-card p-5 mb-6 flex flex-wrap justify-between items-center">
          <div>
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800"><i class="fas fa-balance-scale mr-2 text-indigo-700"></i>LexForge</h1>
            <p class="text-gray-500">Welcome back, ${escapeHtml(userName)} <span class="text-sm">⚖️</span></p>
          </div>
          <div class="flex gap-3 mt-3 sm:mt-0 flex-wrap">
            <button id="newCaseBtn" class="btn-primary"><i class="fas fa-plus-circle"></i> New Case</button>
            <button id="newHearingBtn" class="btn-primary bg-indigo-600"><i class="fas fa-calendar-plus"></i> Add Hearing</button>
            <button id="logoutBtn" class="btn-secondary"><i class="fas fa-sign-out-alt"></i> Exit</button>
          </div>
        </div>
        
        <div class="flex gap-3 mb-6 border-b">
          <button id="tabCases" class="py-2 px-5 font-semibold ${activeTab === 'cases' ? 'text-indigo-700 border-b-2 border-indigo-600' : 'text-gray-500'}">📋 My Cases (${casesList.length})</button>
          <button id="tabHearings" class="py-2 px-5 font-semibold ${activeTab === 'hearings' ? 'text-indigo-700 border-b-2 border-indigo-600' : 'text-gray-500'}">📅 Hearings (${hearingsList.length})</button>
        </div>
        
        <div class="glass-card p-5">
          ${activeTab === 'cases' ? renderCasesTable() : renderHearingsTable()}
        </div>
      </div>
    `;
    
    document.getElementById("newCaseBtn").onclick = () => openCaseModal();
    document.getElementById("newHearingBtn").onclick = () => { 
      if(casesList.length === 0) { showToast("Please create a case first", true); return; }
      openHearingModal();
    };
    document.getElementById("logoutBtn").onclick = handleLogout;
    document.getElementById("tabCases").onclick = () => { activeTab = "cases"; renderDashboard(); };
    document.getElementById("tabHearings").onclick = () => { activeTab = "hearings"; renderDashboard(); };
    attachCaseActions();
    attachHearingActions();
  }
  
  function renderCasesTable() {
    if(casesList.length === 0) return `<div class="text-center py-12 text-gray-400"><i class="fas fa-folder-open text-4xl mb-2"></i><p>No cases registered. Click 'New Case' to begin.</p></div>`;
    return `
      <div class="overflow-x-auto">
        <table>
          <thead><tr><th>Case No.</th><th>Title</th><th>Client</th><th>Court</th><th>Status</th><th>Next Hearing</th><th>Actions</th></tr></thead>
          <tbody>
            ${casesList.map(c => `
              <tr>
                <td class="font-mono text-sm">${escapeHtml(c.case_number || '—')}</td>
                <td class="font-medium">${escapeHtml(c.case_title)}</td>
                <td>${escapeHtml(c.client_name)}</td>
                <td>${escapeHtml(c.court_name || '—')}</td>
                <td><span class="status-badge status-${c.status === 'active' ? 'active' : (c.status === 'pending' ? 'pending' : 'closed')}">${c.status || 'pending'}</span></td>
                <td>${c.next_hearing ? formatDate(c.next_hearing) : '—'}</td>
                <td><button class="edit-case text-indigo-600 mr-2" data-id="${c.id}"><i class="fas fa-edit"></i></button><button class="delete-case text-red-500" data-id="${c.id}"><i class="fas fa-trash-alt"></i></button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }
  
  function renderHearingsTable() {
    if(hearingsList.length === 0) return `<div class="text-center py-12 text-gray-400"><i class="fas fa-gavel text-4xl mb-2"></i><p>No hearings scheduled. Add a hearing for any case.</p></div>`;
    return `
      <div class="overflow-x-auto">
        <table>
          <thead><tr><th>Case Title</th><th>Case Number</th><th>Hearing Date</th><th>Notes</th><th>Actions</th></tr></thead>
          <tbody>
            ${hearingsList.map(h => `
              <tr>
                <td>${escapeHtml(h.cases?.case_title || 'N/A')}</td>
                <td class="font-mono text-xs">${escapeHtml(h.cases?.case_number || '—')}</td>
                <td class="font-semibold">${formatDate(h.hearing_date)}</td>
                <td class="max-w-xs truncate">${escapeHtml(h.hearing_notes?.substring(0,60) || '—')}</td>
                <td><button class="edit-hearing text-indigo-600 mr-2" data-id="${h.id}" data-caseid="${h.case_id}"><i class="fas fa-pen"></i></button><button class="delete-hearing text-red-500" data-id="${h.id}"><i class="fas fa-trash"></i></button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }
  
  function attachCaseActions() {
    document.querySelectorAll('.edit-case').forEach(btn => {
      btn.onclick = () => {
        const id = btn.getAttribute('data-id');
        const caseObj = casesList.find(c => c.id === id);
        if(caseObj) openCaseModal(caseObj);
      };
    });
    document.querySelectorAll('.delete-case').forEach(btn => {
      btn.onclick = () => deleteCase(btn.getAttribute('data-id'));
    });
  }
  
  function attachHearingActions() {
    document.querySelectorAll('.edit-hearing').forEach(btn => {
      btn.onclick = () => {
        const hid = btn.getAttribute('data-id');
        const hearing = hearingsList.find(h => h.id === hid);
        if(hearing) openHearingModal(hearing);
      };
    });
    document.querySelectorAll('.delete-hearing').forEach(btn => {
      btn.onclick = () => deleteHearing(btn.getAttribute('data-id'));
    });
  }
  
  function openCaseModal(caseData = null) {
    editingCase = caseData;
    const modalHtml = `
      <div class="modal-overlay" id="caseModalOverlay">
        <div class="modal-container">
          <h3 class="text-xl font-bold mb-4">${caseData ? 'Edit Case' : 'Register New Case'}</h3>
          <input id="case_title" placeholder="Case Title *" value="${escapeAttr(caseData?.case_title || '')}" class="mb-3">
          <input id="case_number" placeholder="Case Number (Unique)" value="${escapeAttr(caseData?.case_number || '')}" class="mb-3">
          <input id="client_name" placeholder="Client Name *" value="${escapeAttr(caseData?.client_name || '')}" class="mb-3">
          <input id="court_name" placeholder="Court Name" value="${escapeAttr(caseData?.court_name || '')}" class="mb-3">
          <select id="status" class="mb-3"><option value="active" ${caseData?.status==='active'?'selected':''}>Active</option><option value="pending" ${caseData?.status==='pending'?'selected':''}>Pending</option><option value="closed" ${caseData?.status==='closed'?'selected':''}>Closed</option></select>
          <input type="date" id="filing_date" value="${caseData?.filing_date || ''}" class="mb-3">
          <input type="date" id="next_hearing" value="${caseData?.next_hearing || ''}" class="mb-3">
          <textarea id="description" rows="2" placeholder="Case description">${escapeAttr(caseData?.description || '')}</textarea>
          <div class="flex justify-end gap-3 mt-5">
            <button id="closeModalBtn" class="btn-secondary px-5">Cancel</button>
            <button id="saveCaseBtn" class="btn-primary">Save Case</button>
          </div>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    document.getElementById("closeModalBtn").onclick = closeAllModals;
    document.getElementById("saveCaseBtn").onclick = async () => {
      const newCase = {
        case_title: document.getElementById("case_title").value,
        case_number: document.getElementById("case_number").value,
        client_name: document.getElementById("client_name").value,
        court_name: document.getElementById("court_name").value,
        status: document.getElementById("status").value,
        filing_date: document.getElementById("filing_date").value || null,
        next_hearing: document.getElementById("next_hearing").value || null,
        description: document.getElementById("description").value,
      };
      if(!newCase.case_title || !newCase.client_name) { showToast("Case Title and Client Name required", true); return; }
      await saveCase(newCase);
    };
  }
  
  function openHearingModal(hearing = null) {
    editingHearing = hearing;
    const preselectedCase = hearing ? hearing.case_id : (casesList[0]?.id || '');
    const options = casesList.map(c => `<option value="${c.id}" ${preselectedCase === c.id ? 'selected' : ''}>${escapeAttr(c.case_title)} (${c.case_number || 'no#'})</option>`).join('');
    const modalHtml = `
      <div class="modal-overlay" id="hearingModalOverlay">
        <div class="modal-container">
          <h3 class="text-xl font-bold mb-4">${hearing ? 'Edit Hearing' : 'Schedule New Hearing'}</h3>
          <select id="hearing_case_id" class="mb-3" required>${options}</select>
          <input type="date" id="hearing_date" value="${hearing?.hearing_date || ''}" class="mb-3" required>
          <textarea id="hearing_notes" rows="3" placeholder="Hearing notes / remarks">${escapeAttr(hearing?.hearing_notes || '')}</textarea>
          <div class="flex justify-end gap-3 mt-5">
            <button id="closeHearingBtn" class="btn-secondary">Cancel</button>
            <button id="saveHearingBtn" class="btn-primary">Save Hearing</button>
          </div>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    document.getElementById("closeHearingBtn").onclick = closeAllModals;
    document.getElementById("saveHearingBtn").onclick = async () => {
      const caseId = document.getElementById("hearing_case_id").value;
      const hearingDate = document.getElementById("hearing_date").value;
      if(!caseId || !hearingDate) { showToast("Case and Hearing date required", true); return; }
      await saveHearing({
        case_id: caseId,
        hearing_date: hearingDate,
        hearing_notes: document.getElementById("hearing_notes").value,
      });
    };
  }
  
  function closeAllModals() {
    document.querySelectorAll('.modal-overlay').forEach(el => el.remove());
    editingCase = null;
    editingHearing = null;
  }
  
  function formatDate(dateStr) { if(!dateStr) return '—'; const d=new Date(dateStr); return d.toLocaleDateString('en-IN'); }
  function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
  function escapeAttr(str) { if(!str) return ''; return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  
  // ==================== APP INIT ====================
  (async () => {
    const init = initSupabase();
    if (init.error) {
      document.getElementById("app").innerHTML = `<div class="p-8 text-center text-red-700">${init.message}<br>Please set valid SUPABASE_URL and ANON_KEY in the source code.</div>`;
      return;
    }
    const user = await checkSession();
    if (user) {
      await loadCases();
      await loadHearings();
      renderDashboard();
    } else {
      renderLoginScreen();
    }
  })();
</script>
</body>
</html>

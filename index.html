<!DOCTYPE html>
<html>
<head>
<title>Advocate CRM</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f4f6f9;
}

/* SIDEBAR */
.sidebar {
    position: fixed;
    width: 230px;
    height: 100%;
    background: #2c3e50;
    color: white;
    padding: 15px;
}

.logo-box {
    text-align: center;
    margin-bottom: 20px;
}

.logo-box img {
    width: 70px;
}

.sidebar button {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border: none;
    background: transparent;
    color: white;
    text-align: left;
    cursor: pointer;
}

.sidebar button:hover {
    background: #1abc9c;
}

/* CONTENT */
.content {
    margin-left: 250px;
    padding: 20px;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 8px;
    border-bottom: 1px solid #ddd;
}

/* HIDDEN */
.hidden { display: none; }
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <div class="logo-box">
        <img src="logo.png">
        <h3>Advocate CRM</h3>
    </div>

    <button onclick="show('dashboard')">🏠 Dashboard</button>
    <button onclick="show('users')">👤 User Management</button>
    <button onclick="show('clients')">🧑 Clients</button>
    <button onclick="show('cases')">📁 Cases</button>
    <button onclick="show('caseType')">📂 Case Type</button>
    <button onclick="show('court')">🏛️ Court Complex</button>

</div>

<!-- CONTENT -->
<div class="content">

<!-- DASHBOARD -->
<div id="dashboard" class="card">
    <h2>Dashboard</h2>
    <p>Total Clients: <span id="totalClients">0</span></p>
    <p>Total Cases: <span id="totalCases">0</span></p>
</div>

<!-- USERS -->
<div id="users" class="card hidden">
    <h2>User Management</h2>
    <input id="uname" placeholder="Name">
    <input id="umobile" placeholder="Mobile">
    <button onclick="addUser()">Add User</button>

    <table>
        <thead><tr><th>Name</th><th>Mobile</th></tr></thead>
        <tbody id="userTable"></tbody>
    </table>
</div>

<!-- CLIENTS -->
<div id="clients" class="card hidden">
    <h2>Add Client</h2>
    <input id="cname" placeholder="Client Name">
    <input id="cphone" placeholder="Phone">
    <button onclick="addClient()">Add Client</button>

    <table>
        <thead><tr><th>Name</th><th>Phone</th></tr></thead>
        <tbody id="clientTable"></tbody>
    </table>
</div>

<!-- CASE TYPE -->
<div id="caseType" class="card hidden">
    <h2>Case Type</h2>
    <input id="ctype" placeholder="Case Type">
    <button onclick="addCaseType()">Add</button>

    <ul id="caseTypeList"></ul>
</div>

<!-- COURT -->
<div id="court" class="card hidden">
    <h2>Court Complex</h2>
    <input id="courtName" placeholder="Court Name">
    <button onclick="addCourt()">Add</button>

    <ul id="courtList"></ul>
</div>

<!-- CASES -->
<div id="cases" class="card hidden">
    <h2>Add Case</h2>

    <input id="caseClient" placeholder="Client Name">
    <input id="caseTypeInput" placeholder="Case Type">
    <input id="caseCourt" placeholder="Court">
    <input type="date" id="caseDate">

    <button onclick="addCase()">Add Case</button>

    <table>
        <thead>
            <tr>
                <th>Client</th>
                <th>Type</th>
                <th>Court</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody id="caseTable"></tbody>
    </table>
</div>

</div>

<script>
let users = [];
let clients = [];
let cases = [];
let caseTypes = [];
let courts = [];

// NAV
function show(id){
    document.querySelectorAll('.card').forEach(c=>c.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
}

// USER
function addUser(){
    users.push({name: uname.value, mobile: umobile.value});
    renderUsers();
}

function renderUsers(){
    userTable.innerHTML = users.map(u=>`<tr><td>${u.name}</td><td>${u.mobile}</td></tr>`).join('');
}

// CLIENT
function addClient(){
    clients.push({name: cname.value, phone: cphone.value});
    renderClients();
}

function renderClients(){
    clientTable.innerHTML = clients.map(c=>`<tr><td>${c.name}</td><td>${c.phone}</td></tr>`).join('');
    totalClients.innerText = clients.length;
}

// CASE TYPE
function addCaseType(){
    caseTypes.push(ctype.value);
    caseTypeList.innerHTML = caseTypes.map(c=>`<li>${c}</li>`).join('');
}

// COURT
function addCourt(){
    courts.push(courtName.value);
    courtList.innerHTML = courts.map(c=>`<li>${c}</li>`).join('');
}

// CASE
function addCase(){
    cases.push({
        client: caseClient.value,
        type: caseTypeInput.value,
        court: caseCourt.value,
        date: caseDate.value
    });
    renderCases();
}

function renderCases(){
    caseTable.innerHTML = cases.map(c=>`
        <tr>
            <td>${c.client}</td>
            <td>${c.type}</td>
            <td>${c.court}</td>
            <td>${c.date}</td>
        </tr>`).join('');

    totalCases.innerText = cases.length;
}
</script>

</body>
</html>

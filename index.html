<!DOCTYPE html>
<html>
<head>
    <title>Advocate CRM</title>
</head>

<body style="font-family: Arial; text-align: center; margin-top: 30px;">

    <h1>⚖️ Advocate CRM</h1>

    <h3>Add Case</h3>
    <input type="text" id="client_name" placeholder="Client Name"><br><br>
    <input type="text" id="case_type" placeholder="Case Type"><br><br>
    <input type="date" id="hearing_date"><br><br>

    <button onclick="addCase()">Add Case</button>
    <button onclick="getCases()">View Cases</button>

    <h3>Cases List</h3>
    <pre id="output"></pre>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // 🔴 Replace ONLY this with your project URL
        const supabaseUrl = "https://YOUR_PROJECT_ID.supabase.co";

        // ✅ Your Supabase Key (Already Replaced)
        const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ra2hheGptYmp5YWVyeWNkb2JyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NjAyMjcsImV4cCI6MjA4OTMzNjIyN30.JayQMtvX5DARwKwowFtqczmGhaeiC58KOHXrAdPzaTg";

        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // ✅ Add Case
        async function addCase() {
            const client_name = document.getElementById("client_name").value;
            const case_type = document.getElementById("case_type").value;
            const hearing_date = document.getElementById("hearing_date").value;

            const { data, error } = await supabase
                .from('cases')
                .insert([
                    { client_name, case_type, hearing_date }
                ]);

            if (error) {
                alert("Error: " + error.message);
            } else {
                alert("Case Added Successfully ✅");
            }
        }

        // ✅ Get Cases
        async function getCases() {
            const { data, error } = await supabase
                .from('cases')
                .select('*')
                .order('hearing_date', { ascending: true });

            if (error) {
                document.getElementById("output").innerText = "Error: " + error.message;
            } else {
                document.getElementById("output").innerText = JSON.stringify(data, null, 2);
            }
        }
    </script>

</body>
</html>

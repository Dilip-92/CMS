<!DOCTYPE html>
<html>
<head>
<title>Advocate CMS</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f4f6f9;
}

input, select, button {
    padding: 6px;
    margin: 5px 0;
    width: 90%;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.hidden { display: none; }

/* LOGIN */
#loginDiv {
    width: 250px;
    margin: 100px auto;
    padding: 20px;
    text-align: center;
    background: white;
    border-radius: 8px;
}

/* SIDEBAR */
.sidebar {
    position: fixed;
    width: 220px;
    height: 100%;
    background: #2c3e50;
    color: white;
    padding: 15px;
    transition: 0.3s;
}

.sidebar.collapsed { width: 70px; }

.sidebar button {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    background: transparent;
    color: white;
    border: none;
    text-align: left;
    display: flex;
    gap: 10px;
    cursor: pointer;
}

.sidebar button:hover { background: #1abc9c; }

.menu-text { }
.sidebar.collapsed .menu-text { display: none; }

.logo-box {
    text-align: center;
    margin-bottom: 20px;
}

.logo-box img {
    width: 60px;
}

/* CONTENT */
.content {
    margin-left: 240px;
    padding: 20px;
}

.sidebar.collapsed ~ .content {
    margin-left: 90px;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 8px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th { background: #eee; }

.action-btn {
    padding: 4px 8px;
    margin-right: 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<h2 style="padding:10px;">⚖️ Advocate CRM</h2>

<div id="loginDiv" class="card">
    <h3>Login</h3>
    <input id="mobile" placeholder="Mobile">
    <input id="pin" type="password" placeholder="PIN">
    <button onclick="login()">Login</button>
</div>

<div id="dashboard" class="hidden">

<div class="sidebar" id="sidebar">
    <div class="logo-box">
        <img src="logo.png">
        <h3 class="menu-text">Advocate CRM</h3>
    </div>

    <button onclick="showSection('addCase')">📁 <span class="menu-text">Add</span></button>
    <button onclick="showSection('viewCase')">📄 <span class="menu-text">Cases</span></button>
    <button onclick="logout()">🚪 <span class="menu-text">Logout</span></button>
    <button onclick="toggleSidebar()">☰</button>
</div>

<div class="content">

<div id="addCase" class="card section">
    <h3>Add Case</h3>
    <input id="client_name" placeholder="Client Name">
    <input id="case_type" placeholder="Case Type">
    <input id="hearing_date" type="date">

    <select id="status">
        <option>Pending</option>
        <option>Closed</option>
    </select>

    <button onclick="addCase()">Add Case</button>
</div>

<div id="viewCase" class="card section hidden">
    <h3>Cases</h3>

    <table>
        <thead>
            <tr>
                <th>Client</th>
                <th>Type</th>
                <th>Date</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="caseTable"></tbody>
    </table>

</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseUrl = "https://nkkhaxjmbjyaerycdobr.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ra2hheGptYmp5YWVyeWNkb2JyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NjAyMjcsImV4cCI6MjA4OTMzNjIyN30.JayQMtvX5DARwKwowFtqczmGhaeiC58KOHXrAdPzaTg";

const db = supabase.createClient(supabaseUrl, supabaseKey);

async function login() {
    const mobile = document.getElementById("mobile").value;
    const pin = document.getElementById("pin").value;

    const { data } = await db.from('users')
        .select('*')
        .eq('mobile', mobile)
        .eq('pin', pin);

    if (data.length) {
        document.getElementById("loginDiv").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");
        getCases();
    } else {
        alert("Invalid Login");
    }
}

function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("collapsed");
}

function showSection(id) {
    document.querySelectorAll(".section").forEach(s => s.classList.add("hidden"));
    document.getElementById(id).classList.remove("hidden");
}

function logout() {
    location.reload();
}

// ADD
async function addCase() {
    await db.from('cases').insert([{
        client_name: client_name.value,
        case_type: case_type.value,
        hearing_date: hearing_date.value,
        status: status.value
    }]);

    alert("Added");
    getCases();
}

// GET
async function getCases() {
    const { data } = await db.from('cases').select('*');

    let html = "";

    data.forEach(c => {
        html += `
        <tr>
            <td>${c.client_name}</td>
            <td>${c.case_type}</td>
            <td>${c.hearing_date}</td>
            <td>${c.status}</td>
            <td>
                <button class="action-btn" onclick="editCase('${c.id}')">Edit</button>
                <button class="action-btn" onclick="deleteCase('${c.id}')">Delete</button>
            </td>
        </tr>`;
    });

    caseTable.innerHTML = html;
}

// DELETE
async function deleteCase(id) {
    await db.from('cases').delete().eq('id', id);
    getCases();
}

// EDIT
async function editCase(id) {
    const name = prompt("Enter new client name");
    if (!name) return;

    await db.from('cases').update({ client_name: name }).eq('id', id);
    getCases();
}
</script>

</body>
</html>

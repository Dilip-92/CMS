  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

    }

    body {
      background: linear-gradient(135deg, #f5f7fc 0%, #eef2f9 100%);

    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(2px);
      border-radius: 32px;
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0,0,0,0.02);
      border: 1px solid rgba(255,255,255,0.6);
    }

    .btn-primary {
      background: #1e3a8a;
      transition: all 0.2s ease;
      color: white;
      font-weight: 600;
      border: none;
      padding: 10px 20px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);

    .btn-primary:hover {
      background: #0f2b6d;

    .btn-secondary {
      background: #f0f2f5;

      border-radius: 40px;
      cursor: pointer;
    }
    .btn-secondary:hover {
      background: #e6e9ef;
    }
    input, select, textarea {
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 10px 16px;
      width: 100%;
      font-size: 0.9rem;
      transition: 0.2s;
      background: white;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    .status-badge {
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      display: inline-block;
    }
    .status-active { background: #dcfce7; color: #15803d; }
    .status-pending { background: #fff3e3; color: #b45309; }
    .status-closed { background: #f1f5f9; color: #334155; }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {

    .modal-overlay {
      position: fixed;
      top:0; left:0;
      width:100%; height:100%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);

      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-container {
      background: white;
      max-width: 550px;
      width: 90%;
      border-radius: 32px;
      padding: 28px;
    }
    @media (max-width: 768px) {
      .flex-responsive { flex-direction: column; gap: 1rem; }
      th, td { font-size: 0.8rem; padding: 10px 4px; }
    }
    .toast-notification {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1e3a8a;
      color: white;
      padding: 12px 24px;
      border-radius: 40px;
      z-index: 1100;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }
    .info-message {
      background: #e0f2fe;
      border-left: 4px solid #0284c7;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: #0c4a6e;
    }
    .min-h-screen {
      min-height: 100vh;
    }
    .flex {
      display: flex;
    }
    .items-center {
      align-items: center;
    }
    .justify-center {
      justify-content: center;
    }
    .w-full {
      width: 100%;
    }
    .max-w-md {
      max-width: 28rem;
    }
    .p-8 {
      padding: 2rem;
    }
    .shadow-2xl {
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }
    .text-center {
      text-align: center;
    }
    .mb-6 {
      margin-bottom: 1.5rem;
    }
    .mb-3 {
      margin-bottom: 0.75rem;
    }
    .mb-4 {
      margin-bottom: 1rem;
    }
    .mt-1 {
      margin-top: 0.25rem;
    }

    .mt-6 {
      margin-top: 1.5rem;
    }
    .mr-2 {
      margin-right: 0.5rem;
    }
    .ml-1 {
      margin-left: 0.25rem;
    }
    .py-2 {
      padding-top: 0.5rem;
      padding-bottom: 0.5rem;
    }
    .py-3 {
      padding-top: 0.75rem;
      padding-bottom: 0.75rem;
    }
    .px-4 {
      padding-left: 1rem;
      padding-right: 1rem;
    }
    .px-5 {
      padding-left: 1.25rem;
      padding-right: 1.25rem;
    }
    .text-3xl {
      font-size: 1.875rem;
    }
    .text-5xl {
      font-size: 3rem;
    }
    .text-xs {
      font-size: 0.75rem;
    }
    .text-sm {
      font-size: 0.875rem;
    }
    .font-bold {
      font-weight: 700;
    }
    .font-semibold {
      font-weight: 600;
    }
    .text-gray-800 {
      color: #1f2937;
    }
    .text-gray-500 {
      color: #6b7280;
    }
    .text-gray-400 {
      color: #9ca3af;
    }
    .text-indigo-700 {
      color: #4338ca;
    }
    .text-indigo-600 {
      color: #4f46e5;
    }
    .text-red-500 {
      color: #ef4444;
    }
    .border-b {
      border-bottom: 1px solid #e5e7eb;
    }
    .border-b-2 {
      border-bottom-width: 2px;
    }
    .border-indigo-600 {
      border-color: #4f46e5;
    }
    .gap-2 {
      gap: 0.5rem;
    }
    .gap-3 {
      gap: 0.75rem;
    }
    .mt-3 {
      margin-top: 0.75rem;
    }
    .max-w-7xl {
      max-width: 80rem;
    }
    .mx-auto {
      margin-left: auto;
      margin-right: auto;
    }
    .p-4 {

    }
    .p-5 {
      padding: 1.25rem;
    }

    }
    .flex-wrap {
      flex-wrap: wrap;
    }
    .justify-between {
      justify-content: space-between;
    }
    .overflow-x-auto {
      overflow-x: auto;
    }
    .truncate {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .max-w-xs {
      max-width: 20rem;
    }
    .font-mono {
      font-family: monospace;
    }
    .py-12 {
      padding-top: 3rem;
      padding-bottom: 3rem;
    }
    .text-4xl {

    }
    .bg-indigo-700 {

    }

<body>

<div id="app">
  <div class="loading">
    <i class="fas fa-spinner fa-spin fa-2x"></i>
    <p>Loading application...</p>
  </div>
</div>

<script>
  // ==================== CONFIGURATION ====================
  const SUPABASE_URL = "https://nkkhaxjmbjyaerycdobr.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ra2hheGptYmp5YWVyeWNkb2JyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NjAyMjcsImV4cCI6MjA4OTMzNjIyN30.JayQMtvX5DARwKwowFtqczmGhaeiC58KOHXrAdPzaTg";
  
  // Global state
  let supabaseClient = null;
  let currentUser = null;
  let activeTab = "cases";
  let casesList = [];
  let hearingsList = [];
  let editingCase = null;
  let editingHearing = null;
  let pendingEmail = null;
  
  // Helper functions
  function showToast(message, isError = false, duration = 3000) {
    if (!document.body) {
      console.log("Toast:", message);
      return;
    }
    
    const toast = document.createElement('div');
    toast.className = 'toast-notification';
    toast.style.backgroundColor = isError ? '#dc2626' : '#1e3a8a';
    toast.innerHTML = message;
    document.body.appendChild(toast);
    setTimeout(() => {
      if (toast && toast.remove) toast.remove();
    }, duration);
  }
  
  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }
  
  function escapeAttr(str) {
    if (!str) return '';
    return String(str).replace(/"/g, '&quot;');
  }
  
  function formatDate(dateStr) {
    if (!dateStr) return '—';
    try {
      const date = new Date(dateStr);
      return date.toLocaleDateString();
    } catch(e) {
      return dateStr;
    }
  }
  
  function closeAllModals() {
    const overlays = document.querySelectorAll('.modal-overlay');
    overlays.forEach(overlay => overlay.remove());
    editingCase = null;
    editingHearing = null;
  }
  
  // Initialize Supabase
  function initSupabase() {
    return new Promise((resolve, reject) => {
      try {
        // Check if supabase is loaded
        if (typeof window.supabase === 'undefined') {
          console.error("Supabase not loaded yet, waiting...");
          // Wait for supabase to load
          let attempts = 0;
          const checkInterval = setInterval(() => {
            attempts++;
            if (typeof window.supabase !== 'undefined') {
              clearInterval(checkInterval);
              try {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                  auth: {
                    autoRefreshToken: true,
                    persistSession: true,
                    detectSessionInUrl: true
                  }
                });
                console.log("✅ Supabase client created successfully");
                resolve(true);
              } catch (err) {
                reject(err);
              }
            } else if (attempts > 50) {
              clearInterval(checkInterval);
              reject(new Error("Supabase library failed to load after 5 seconds"));
            }
          }, 100);
        } else {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
              autoRefreshToken: true,
              persistSession: true,
              detectSessionInUrl: true
            }
          });
          console.log("✅ Supabase client created successfully");
          resolve(true);
        }
      } catch (error) {
        console.error("❌ Supabase init error:", error);
        reject(error);
      }
    });
  }
  
  // Auth functions
  async function checkSession() {
    if (!supabaseClient) return null;
    try {
      const { data: { session }, error } = await supabaseClient.auth.getSession();
      if (error) {
        console.error("Session error:", error);
        return null;
      }
      if (session) {
        currentUser = session.user;
        await fetchUserProfile();
        return currentUser;
      }
      return null;
    } catch (error) {
      console.error("Session exception:", error);
      return null;
    }
  }
  
  async function fetchUserProfile() {
    if (!currentUser) return;
    try {
      const { data, error } = await supabaseClient
        .from('profiles')
        .select('full_name')
        .eq('id', currentUser.id)
        .maybeSingle();
      
      if (!error && data) {
        currentUser.user_metadata = { ...currentUser.user_metadata, full_name: data.full_name };
      }
    } catch (error) {
      console.error("Profile fetch exception:", error);
    }
  }
  
  async function createUserProfile(userId, fullName) {
    try {
      const { error } = await supabaseClient
        .from('profiles')
        .insert([{ id: userId, full_name: fullName }]);
      
      if (error && error.code !== '23505') {
        console.error("Profile creation error:", error);
        return false;
      }
      return true;
    } catch (error) {
      console.error("Profile creation exception:", error);
      return false;
    }
  }
  
  async function resendConfirmationEmail(email) {
    if (!supabaseClient || !email) return;
    
    try {
      const { error } = await supabaseClient.auth.resend({
        type: 'signup',
        email: email,
        options: {
          emailRedirectTo: window.location.origin
        }
      });
      
      if (error) throw error;
      showToast("✅ Confirmation email resent! Please check your inbox (and spam folder).", false, 5000);
    } catch (error) {
      showToast("Error resending confirmation: " + error.message, true);
    }
  }
  
  async function handleLogin(email, password, isSignUp = false, fullName = "") {
    if (!supabaseClient) {
      showToast("Supabase not initialized", true);
      return false;
    }
    
    try {
      if (isSignUp) {
        console.log("📝 Signing up:", email);
        const { data, error } = await supabaseClient.auth.signUp({
          email, 
          password,
          options: { 
            data: { full_name: fullName },
            emailRedirectTo: window.location.origin
          }
        });
        
        if (error) throw error;
        
        if (data.user) {
          pendingEmail = email;
          await createUserProfile(data.user.id, fullName);
          showToast("✅ Account created! Please check your email to confirm your account before logging in.", false, 6000);
          
          const nameInput = document.getElementById("signup-name");
          const emailInput = document.getElementById("signup-email");
          const pwdInput = document.getElementById("signup-password");
          if (nameInput) nameInput.value = "";
          if (emailInput) emailInput.value = "";
          if (pwdInput) pwdInput.value = "";
          
          setTimeout(() => {
            const loginTab = document.getElementById("tab-login-btn");
            if (loginTab) loginTab.click();
          }, 1000);
        }
        return false;
      } else {
        console.log("🔐 Logging in:", email);
        const { data, error } = await supabaseClient.auth.signInWithPassword({ 
          email, 
          password 
        });
        
        if (error) {
          if (error.message.includes("Email not confirmed")) {
            pendingEmail = email;
            showToast("⚠️ Please confirm your email address before logging in. Check your inbox (and spam folder) for the confirmation link.", true, 6000);
            return false;
          }
          if (error.message.includes("Invalid login credentials")) {
            showToast("Invalid email or password. Please try again.", true);
            return false;
          }
          throw error;
        }
        
        currentUser = data.user;
        
        if (!currentUser.confirmed_at) {
          showToast("Please confirm your email before logging in. Check your inbox.", true);
          await supabaseClient.auth.signOut();
          return false;
        }
        
        await fetchUserProfile();
        if (!currentUser.user_metadata?.full_name) {
          await createUserProfile(currentUser.id, currentUser.email.split('@')[0]);
          await fetchUserProfile();
        }
        
        await loadCases();
        await loadHearings();
        renderDashboard();
        showToast(`Welcome back, ${currentUser.user_metadata?.full_name || currentUser.email}`);
        return true;
      }
    } catch (err) {
      console.error("Login error:", err);
      showToast(err.message, true);
      return false;
    }
  }
  
  async function handleLogout() {
    if (supabaseClient) {
      await supabaseClient.auth.signOut();
    }
    currentUser = null;
    casesList = [];
    hearingsList = [];
    renderLoginScreen();
    showToast("Logged out successfully");
  }
  
  // Data functions
  async function loadCases() {
    if (!currentUser || !supabaseClient) return;
    try {
      const { data, error } = await supabaseClient
        .from('cases')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false });
      
      if (!error) {
        casesList = data || [];
      } else {
        console.error("Load cases error:", error);
        if (error.message.includes("JWT") || error.message.includes("401")) {
          showToast("Session expired. Please login again.", true);
          await handleLogout();
        }
      }
    } catch (error) {
      console.error("Load cases exception:", error);
    }
    if (activeTab === 'cases') renderDashboard();
  }
  
  async function loadHearings() {
    if (!currentUser || !supabaseClient) return;
    try {
      const { data, error } = await supabaseClient
        .from('hearings')
        .select('*, cases(case_title, case_number)')
        .eq('user_id', currentUser.id)
        .order('hearing_date', { ascending: false });
      
      if (!error) {
        hearingsList = data || [];
      } else {
        console.error("Load hearings error:", error);
      }
    } catch (error) {
      console.error("Load hearings exception:", error);
    }
    if (activeTab === 'hearings') renderDashboard();
  }
  
  async function saveCase(caseData) {
    if (!currentUser || !supabaseClient) return false;
    const payload = { ...caseData, user_id: currentUser.id };
    let result;
    try {
      if (editingCase) {
        result = await supabaseClient
          .from('cases')
          .update(payload)
          .eq('id', editingCase.id)
          .eq('user_id', currentUser.id);
      } else {
        result = await supabaseClient.from('cases').insert([payload]);
      }
      if (!result.error) {
        await loadCases();
        closeAllModals();
        showToast(editingCase ? "Case updated successfully" : "Case created successfully");
        return true;
      } else {
        showToast("Error: " + result.error.message, true);
        return false;
      }
    } catch (error) {
      showToast("Error saving case: " + error.message, true);
      return false;
    }
  }
  
  async function deleteCase(caseId) {
    if (!confirm("Delete this case permanently? All related hearings will be removed.")) return;
    try {
      const { error } = await supabaseClient
        .from('cases')
        .delete()
        .eq('id', caseId)
        .eq('user_id', currentUser.id);
      if (!error) {
        await loadCases();
        await loadHearings();
        showToast("Case deleted successfully");
      } else {
        showToast(error.message, true);
      }
    } catch (error) {
      showToast("Error deleting case: " + error.message, true);
    }
  }
  
  async function saveHearing(hearingData) {
    if (!currentUser || !supabaseClient) return;
    const payload = {
      case_id: hearingData.case_id,
      hearing_date: hearingData.hearing_date,
      hearing_notes: hearingData.hearing_notes,
      user_id: currentUser.id,
    };
    let result;
    try {
      if (editingHearing) {
        result = await supabaseClient
          .from('hearings')
          .update(payload)
          .eq('id', editingHearing.id)
          .eq('user_id', currentUser.id);
      } else {
        result = await supabaseClient.from('hearings').insert([payload]);
      }
      if (!result.error) {
        await loadHearings();
        closeAllModals();
        showToast(editingHearing ? "Hearing updated" : "Hearing scheduled");
      } else {
        showToast("Error: " + result.error.message, true);
      }
    } catch (error) {
      showToast("Error saving hearing: " + error.message, true);
    }
  }
  
  async function deleteHearing(hearingId) {
    if (!confirm("Remove this hearing record?")) return;
    try {
      const { error } = await supabaseClient
        .from('hearings')
        .delete()
        .eq('id', hearingId)
        .eq('user_id', currentUser.id);
      if (!error) {
        await loadHearings();
        showToast("Hearing deleted");
      } else {
        showToast(error.message, true);
      }
    } catch (error) {
      showToast("Error deleting hearing: " + error.message, true);
    }
  }
  
  // Modal functions
  function openCaseModal(caseData = null) {
    editingCase = caseData;
    const modalHtml = `
      <div class="modal-overlay" id="caseModalOverlay">
        <div class="modal-container">
          <h3 class="text-xl font-bold mb-4">${caseData ? 'Edit Case' : 'Register New Case'}</h3>
          <input id="case_title" placeholder="Case Title *" value="${escapeAttr(caseData?.case_title || '')}" class="mb-3">
          <input id="case_number" placeholder="Case Number (Unique)" value="${escapeAttr(caseData?.case_number || '')}" class="mb-3">
          <input id="client_name" placeholder="Client Name *" value="${escapeAttr(caseData?.client_name || '')}" class="mb-3">
          <input id="court_name" placeholder="Court Name" value="${escapeAttr(caseData?.court_name || '')}" class="mb-3">
          <select id="status" class="mb-3">
            <option value="active" ${caseData?.status==='active'?'selected':''}>Active</option>
            <option value="pending" ${caseData?.status==='pending'?'selected':''}>Pending</option>
            <option value="closed" ${caseData?.status==='closed'?'selected':''}>Closed</option>
          </select>
          <input type="date" id="filing_date" value="${caseData?.filing_date || ''}" class="mb-3">
          <input type="date" id="next_hearing" value="${caseData?.next_hearing || ''}" class="mb-3">
          <textarea id="description" rows="2" placeholder="Case description">${escapeAttr(caseData?.description || '')}</textarea>
          <div class="flex justify-end gap-3 mt-5">
            <button id="closeModalBtn" class="btn-secondary px-5">Cancel</button>
            <button id="saveCaseBtn" class="btn-primary">Save Case</button>
          </div>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    const closeBtn = document.getElementById("closeModalBtn");
    const saveBtn = document.getElementById("saveCaseBtn");
    if (closeBtn) closeBtn.onclick = closeAllModals;
    if (saveBtn) {
      saveBtn.onclick = async () => {
        const newCase = {
          case_title: document.getElementById("case_title").value,
          case_number: document.getElementById("case_number").value,
          client_name: document.getElementById("client_name").value,
          court_name: document.getElementById("court_name").value,
          status: document.getElementById("status").value,
          filing_date: document.getElementById("filing_date").value || null,
          next_hearing: document.getElementById("next_hearing").value || null,
          description: document.getElementById("description").value
        };
        if (!newCase.case_title || !newCase.client_name) {
          showToast("Case Title and Client Name are required", true);
          return;
        }
        await saveCase(newCase);
      };
    }
  }
  
  function openHearingModal(hearingData = null) {
    editingHearing = hearingData;
    const modalHtml = `
      <div class="modal-overlay" id="hearingModalOverlay">
        <div class="modal-container">
          <h3 class="text-xl font-bold mb-4">${hearingData ? 'Edit Hearing' : 'Schedule New Hearing'}</h3>
          <select id="case_id" class="mb-3">
            <option value="">Select Case</option>
            ${casesList.map(c => `<option value="${c.id}" ${hearingData?.case_id === c.id ? 'selected' : ''}>${escapeHtml(c.case_number || '')} - ${escapeHtml(c.case_title)}</option>`).join('')}
          </select>
          <input type="date" id="hearing_date" value="${hearingData?.hearing_date || ''}" class="mb-3">
          <textarea id="hearing_notes" rows="3" placeholder="Hearing notes, outcomes, remarks">${escapeAttr(hearingData?.hearing_notes || '')}</textarea>
          <div class="flex justify-end gap-3 mt-5">
            <button id="closeModalBtn" class="btn-secondary px-5">Cancel</button>
            <button id="saveHearingBtn" class="btn-primary">Save Hearing</button>
          </div>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    const closeBtn = document.getElementById("closeModalBtn");
    const saveBtn = document.getElementById("saveHearingBtn");
    if (closeBtn) closeBtn.onclick = closeAllModals;
    if (saveBtn) {
      saveBtn.onclick = async () => {
        const hearing = {
          case_id: document.getElementById("case_id").value,
          hearing_date: document.getElementById("hearing_date").value,
          hearing_notes: document.getElementById("hearing_notes").value
        };
        if (!hearing.case_id || !hearing.hearing_date) {
          showToast("Please select a case and hearing date", true);
          return;
        }
        await saveHearing(hearing);
      };
    }
  }
  
  // UI Rendering functions
  function renderLoginScreen() {
    const app = document.getElementById("app");
    if (!app) return;
    
    app.innerHTML = `
      <div class="min-h-screen flex items-center justify-center p-5" style="min-height:100vh; background: radial-gradient(circle at 10% 20%, #eef2ff, #e0e7ff);">
        <div class="glass-card w-full max-w-md p-8 shadow-2xl">
          <div class="text-center mb-6">
            <i class="fas fa-gavel text-5xl text-indigo-800 mb-3"></i>
            <h2 class="text-3xl font-bold text-gray-800">LexForge</h2>
            <p class="text-gray-500 mt-1">Advocate Case Management Suite</p>
          </div>
          
          <div class="info-message">
            <i class="fas fa-envelope mr-2"></i>
            <strong>Email confirmation required:</strong> After signing up, you'll receive a confirmation email. Please verify your email before logging in.
          </div>
          
          <div id="auth-tabs" class="flex gap-2 mb-6 border-b">
            <button id="tab-login-btn" class="py-2 px-4 font-semibold text-indigo-700 border-b-2 border-indigo-600">Login</button>
            <button id="tab-signup-btn" class="py-2 px-4 font-semibold text-gray-500">Sign Up</button>
          </div>
          <div id="login-panel">
            <input type="email" id="login-email" placeholder="Email address" class="mb-3" />
            <input type="password" id="login-password" placeholder="Password" class="mb-4" />
            <button id="do-login-btn" class="btn-primary w-full py-3">Access Dashboard <i class="fas fa-arrow-right ml-1"></i></button>
            <div id="resend-section" style="display:none; margin-top: 12px;">
              <button id="resend-confirm-btn" class="btn-secondary w-full py-2 text-sm">
                <i class="fas fa-paper-plane"></i> Resend confirmation email
              </button>
            </div>
          </div>
          <div id="signup-panel" style="display:none;">
            <input type="text" id="signup-name" placeholder="Full Name" class="mb-3" />
            <input type="email" id="signup-email" placeholder="Email address" class="mb-3" />
            <input type="password" id="signup-password" placeholder="Password (min 6 chars)" class="mb-4" />
            <button id="do-signup-btn" class="btn-primary w-full py-3 bg-indigo-700">Create Account</button>
          </div>
          <p class="text-xs text-center text-gray-400 mt-6">🔐 Secure RLS | Email confirmation required for security</p>
        </div>
      </div>
    `;
    
    let currentLoginEmail = "";
    
    const loginTab = document.getElementById("tab-login-btn");
    const signupTab = document.getElementById("tab-signup-btn");
    const loginPanel = document.getElementById("login-panel");
    const signupPanel = document.getElementById("signup-panel");
    const doLoginBtn = document.getElementById("do-login-btn");
    const doSignupBtn = document.getElementById("do-signup-btn");
    const resendBtn = document.getElementById("resend-confirm-btn");
    
    if (loginTab) {
      loginTab.onclick = () => {
        if (loginPanel) loginPanel.style.display = "block";
        if (signupPanel) signupPanel.style.display = "none";
        loginTab.classList.add("border-b-2", "border-indigo-600", "text-indigo-700");
        if (signupTab) signupTab.classList.remove("border-b-2", "border-indigo-600", "text-indigo-700");
        const resendSection = document.getElementById("resend-section");
        if (resendSection) resendSection.style.display = "none";
      };
    }
    
    if (signupTab) {
      signupTab.onclick = () => {
        if (signupPanel) signupPanel.style.display = "block";
        if (loginPanel) loginPanel.style.display = "none";
        signupTab.classList.add("border-b-2", "border-indigo-600", "text-indigo-700");
        if (loginTab) loginTab.classList.remove("border-b-2", "border-indigo-600", "text-indigo-700");
      };
    }
    
    if (doLoginBtn) {
      doLoginBtn.onclick = async () => {
        const email = document.getElementById("login-email")?.value || "";
        const pwd = document.getElementById("login-password")?.value || "";
        currentLoginEmail = email;
        
        if(email && pwd) {
          const success = await handleLogin(email, pwd, false);
          if (!success) {
            const resendSection = document.getElementById("resend-section");
            if (resendSection) resendSection.style.display = "block";
          }
        } else {
          showToast("Enter email and password", true);
        }
      };
    }
    
    if (doSignupBtn) {
      doSignupBtn.onclick = async () => {
        const name = document.getElementById("signup-name")?.value || "";
        const email = document.getElementById("signup-email")?.value || "";
        const pwd = document.getElementById("signup-password")?.value || "";
        if(!name || !email || pwd.length<6) { 
          showToast("Full name, valid email, password min 6 chars", true); 
          return; 
        }
        await handleLogin(email, pwd, true, name);
      };
    }
    
    if (resendBtn) {
      resendBtn.onclick = async () => {
        const email = document.getElementById("login-email")?.value || pendingEmail;
        if (email) {
          await resendConfirmationEmail(email);
        } else {
          showToast("Please enter your email address first", true);
        }
      };
    }
  }
  
  function renderDashboard() {
    if (!currentUser) return;
    const app = document.getElementById("app");
    if (!app) return;
    
    const userName = currentUser.user_metadata?.full_name || currentUser.email?.split('@')[0] || "Advocate";
    app.innerHTML = `
      <div class="max-w-7xl mx-auto p-4 md:p-6">
        <div class="glass-card p-5 mb-6 flex flex-wrap justify-between items-center">
          <div>
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800"><i class="fas fa-balance-scale mr-2 text-indigo-700"></i>LexForge</h1>
            <p class="text-gray-500">Welcome back, ${escapeHtml(userName)} <span class="text-sm">⚖️</span></p>
          </div>
          <div class="flex gap-3 mt-3 sm:mt-0 flex-wrap">
            <button id="newCaseBtn" class="btn-primary"><i class="fas fa-plus-circle"></i> New Case</button>
            <button id="newHearingBtn" class="btn-primary bg-indigo-600"><i class="fas fa-calendar-plus"></i> Add Hearing</button>
            <button id="logoutBtn" class="btn-secondary"><i class="fas fa-sign-out-alt"></i> Exit</button>
          </div>
        </div>
        
        <div class="flex gap-3 mb-6 border-b">
          <button id="tabCases" class="py-2 px-5 font-semibold ${activeTab === 'cases' ? 'text-indigo-700 border-b-2 border-indigo-600' : 'text-gray-500'}">📋 My Cases (${casesList.length})</button>
          <button id="tabHearings" class="py-2 px-5 font-semibold ${activeTab === 'hearings' ? 'text-indigo-700 border-b-2 border-indigo-600' : 'text-gray-500'}">📅 Hearings (${hearingsList.length})</button>
        </div>
        
        <div class="glass-card p-5">
          ${activeTab === 'cases' ? renderCasesTable() : renderHearingsTable()}
        </div>
      </div>
    `;
    
    const newCaseBtn = document.getElementById("newCaseBtn");
    const newHearingBtn = document.getElementById("newHearingBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const tabCases = document.getElementById("tabCases");
    const tabHearings = document.getElementById("tabHearings");
    
    if (newCaseBtn) newCaseBtn.onclick = () => openCaseModal();
    if (newHearingBtn) {
      newHearingBtn.onclick = () => { 
        if(casesList.length === 0) { showToast("Please create a case first", true); return; }
        openHearingModal();
      };
    }
    if (logoutBtn) logoutBtn.onclick = handleLogout;
    if (tabCases) tabCases.onclick = () => { activeTab = "cases"; renderDashboard(); loadCases(); };
    if (tabHearings) tabHearings.onclick = () => { activeTab = "hearings"; renderDashboard(); loadHearings(); };
    attachCaseActions();
    attachHearingActions();
  }
  
  function renderCasesTable() {
    if(casesList.length === 0) return `<div class="text-center py-12 text-gray-400"><i class="fas fa-folder-open text-4xl mb-2"></i><p>No cases registered. Click 'New Case' to begin.</p></div>`;
    return `
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead>
            <tr><th>Case No.</th><th>Title</th><th>Client</th><th>Court</th><th>Status</th><th>Next Hearing</th><th>Actions</th></tr>
          </thead>
          <tbody>
            ${casesList.map(c => `
              <tr>
                <td class="font-mono text-sm">${escapeHtml(c.case_number || '—')}</td>
                <td class="font-medium">${escapeHtml(c.case_title)}</td>
                <td>${escapeHtml(c.client_name)}</td>
                <td>${escapeHtml(c.court_name || '—')}</td>
                <td><span class="status-badge status-${c.status === 'active' ? 'active' : (c.status === 'pending' ? 'pending' : 'closed')}">${c.status || 'pending'}</span></td>
                <td>${c.next_hearing ? formatDate(c.next_hearing) : '—'}</td>
                <td><button class="edit-case text-indigo-600 mr-2" data-id="${c.id}"><i class="fas fa-edit"></i></button><button class="delete-case text-red-500" data-id="${c.id}"><i class="fas fa-trash-alt"></i></button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }
  
  function renderHearingsTable() {
    if(hearingsList.length === 0) return `<div class="text-center py-12 text-gray-400"><i class="fas fa-gavel text-4xl mb-2"></i><p>No hearings scheduled. Add a hearing for any case.</p></div>`;
    return `
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead>
            <tr><th>Case Title</th><th>Case Number</th><th>Hearing Date</th><th>Notes</th><th>Actions</th></tr>
          </thead>
          <tbody>
            ${hearingsList.map(h => `
              <tr>
                <td>${escapeHtml(h.cases?.case_title || 'N/A')}</td>
                <td class="font-mono text-xs">${escapeHtml(h.cases?.case_number || '—')}</td>
                <td class="font-semibold">${formatDate(h.hearing_date)}</td>
                <td class="max-w-xs truncate">${escapeHtml(h.hearing_notes?.substring(0,60) || '—')}</td>
                <td><button class="edit-hearing text-indigo-600 mr-2" data-id="${h.id}" data-caseid="${h.case_id}"><i class="fas fa-pen"></i></button><button class="delete-hearing text-red-500" data-id="${h.id}"><i class="fas fa-trash"></i></button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }
  
  function attachCaseActions() {
    document.querySelectorAll('.edit-case').forEach(btn => {
      btn.onclick = () => {
        const id = btn.getAttribute('data-id');
        const caseObj = casesList.find(c => c.id === id);
        if(caseObj) openCaseModal(caseObj);
      };
    });
    document.querySelectorAll('.delete-case').forEach(btn => {
      btn.onclick = () => deleteCase(btn.getAttribute('data-id'));
    });
  }
  
  function attachHearingActions() {
    document.querySelectorAll('.edit-hearing').forEach(btn => {
      btn.onclick = () => {
        const hid = btn.getAttribute('data-id');
        const hearing = hearingsList.find(h => h.id === hid);
        if(hearing) openHearingModal(hearing);
      };
    });
    document.querySelectorAll('.delete-hearing').forEach(btn => {
      btn.onclick = () => deleteHearing(btn.getAttribute('data-id'));
    });
  }
  
  // Initialize app
  async function initApp() {
    try {
      await initSupabase();
      const user = await checkSession();
      if (user) {
        await loadCases();
        await loadHearings();
        renderDashboard();
      } else {
        renderLoginScreen();
      }
    } catch (error) {
      console.error("Failed to initialize app:", error);
      const app = document.getElementById("app");
      if (app) {
        app.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-5">
            <div class="glass-card w-full max-w-md p-8 text-center">
              <i class="fas fa-exclamation-triangle text-5xl text-red-500 mb-4"></i>
              <h2 class="text-xl font-bold mb-2">Connection Error</h2>
              <p class="text-gray-600 mb-4">Unable to load the application. Please check your internet connection and refresh the page.</p>
              <button onclick="location.reload()" class="btn-primary">Refresh Page</button>
            </div>
          </div>
        `;
      }
    }
  }
  
  // Start the app
  initApp();
</script>
</body>
</html>
